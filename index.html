<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mirzanin Mutfağı | Home</title>
  <style>
    :root{
      --purple:#5a189a;
      --purple2:#3c096c;
      --yellow:#f6c21c;
      --text:#111;
      --card:#ffffff;
      --border:rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      color:var(--text);
      background:
        linear-gradient(rgba(255,255,255,.92), rgba(255,255,255,.92)),
        url("pattern.png");
      background-size: 900px;
      background-repeat: repeat;
    }
    header{
      background:linear-gradient(90deg,var(--purple),var(--purple2));
      color:#fff;
      border-bottom:4px solid var(--yellow);
      padding:14px 18px;
    }
    .wrap{max-width:980px;margin:0 auto;padding:18px}
    .hero{
      margin:22px auto 10px;
      background:rgba(255,255,255,.9);
      border:1px solid var(--border);
      border-radius:22px;
      padding:26px 18px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      text-align:center;
    }
    .logo{
      width:min(360px,80vw);
      height:auto;
      display:block;
      margin:6px auto 10px;
    }
    .subtitle{
      margin:10px 0 0;
      color:#333;
      font-size:15px;
      line-height:1.6;
    }
    .buttons{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:18px;
    }
    .btn{
      border:0;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      padding:14px 18px;
      border-radius:16px;
      min-width:190px;
      transition:transform .08s ease;
      box-shadow:0 10px 22px rgba(0,0,0,.10);
    }
    .btn:active{transform:scale(.99)}
    .btn.menu{
      background:var(--yellow);
      color:#000;
    }
    .btn.about{
      background:#fff;
      color:#000;
      border:2px solid rgba(0,0,0,.12);
    }
    footer{
      padding:20px 18px 26px;
      text-align:center;
      color:#222;
      font-size:14px;
    }
    footer a{color:var(--purple);font-weight:800;text-decoration:none}
    .small{
      margin-top:6px;
      opacity:.75;
      font-size:12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap" style="padding:0;display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div style="font-weight:900;">Mirzanin Mutfağı</div>
      <div style="font-size:13px;opacity:.9;">Online Sipariş • WhatsApp</div>
    </div>
  </header>

  <div class="wrap">
    <div class="hero">
      <img class="logo" src="logo.png" alt="Mirzanin Mutfağı Logo">
      <p class="subtitle">
        Ürünleri seçin, adet belirleyin ve siparişi WhatsApp’tan gönderin.<br/>
        (Fiyatlar şu an gösterilmiyor.)
      </p>

      <div class="buttons">
        <a class="btn menu" href="menu.html">🍽️ Menu</a>
        <a class="btn about" href="about.html">ℹ️ About Us</a>
      </div>
    </div>
  </div>

  <footer>
    Instagram: <a href="https://www.instagram.com/mirzaninmutfagi?igsh=czNydXQ2bm1qa3c2&utm_source=qr" target="_blank" rel="noopener"> @mirzaninmutfagi</a>
    <div class="small">© Mirzanin Mutfağı</div>
  </footer>
</body>
</html>
