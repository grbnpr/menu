<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mirzanin Mutfağı | Ana Sayfa</title>
  <style>
    :root{
      --purple:#6a1bb1;
      --yellow:#f6c21c;
      --text:#1c1c1c;
      --card:#ffffffcc;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Tahoma, Arial;
      color:var(--text);
      min-height:100vh;
      background:
        linear-gradient(180deg, rgba(246,194,28,.12), rgba(106,27,177,.10)),
        url('pattern.png');
      background-size:auto, 900px;
      background-repeat:repeat;
    }
    .topbar{
      background:linear-gradient(90deg, var(--purple), #4b0f86);
      color:#fff;
      padding:14px 18px;
      font-weight:800;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:sticky;
      top:0;
      z-index:10;
      border-bottom: 3px solid rgba(246,194,28,.55);
    }
    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:28px 16px 40px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:calc(100vh - 56px);
    }
    .card{
      width:100%;
      max-width:760px;
      background:var(--card);
      backdrop-filter: blur(6px);
      border:1px solid rgba(0,0,0,.08);
      border-radius:22px;
      padding:28px 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.10);
      text-align:center;
    }
    .logo{
      width:min(340px, 70vw);
      height:auto;
      display:block;
      margin:0 auto 14px;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.18));
    }
    h1{
      margin:8px 0 6px;
      font-size:22px;
      line-height:1.25;
    }
    .sub{
      margin:0 0 18px;
      color:rgba(0,0,0,.65);
      font-size:14px;
    }
    .btns{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:10px;
    }
    a.btn{
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:12px 16px;
      border-radius:14px;
      font-weight:800;
      min-width:190px;
      border:1px solid rgba(0,0,0,.12);
      transition: transform .06s ease, box-shadow .15s ease;
    }
    a.btn:hover{transform: translateY(-1px)}
    .btn-menu{
      background: linear-gradient(90deg, var(--yellow), #ffd95c);
      color:#151515;
      box-shadow:0 10px 22px rgba(246,194,28,.22);
    }
    .btn-about{
      background: linear-gradient(90deg, var(--purple), #8e43d6);
      color:#fff;
      box-shadow:0 10px 22px rgba(106,27,177,.22);
    }
    .mini{
      margin-top:14px;
      font-size:12px;
      color:rgba(0,0,0,.6);
    }
    .mini a{color:rgba(0,0,0,.7)}
    footer{
      text-align:center;
      padding:16px 10px 22px;
      color:rgba(0,0,0,.55);
      font-size:12px;
    }
    footer a{color:rgba(0,0,0,.7)}
  </style>
</head>
<body>
  <div class="topbar">Mirzanin Mutfağı</div>

  <div class="wrap">
    <div class="card">
      <img class="logo" src="logo.png" alt="Mirzanin Mutfağı Logo" />
      <h1>Online Sipariş & Menü</h1>
      <p class="sub">Menüyü görüntüleyin veya hakkımızda bilgi alın.</p>

      <div class="btns">
        <a class="btn btn-menu" href="menu.html">1) Menü</a>
        <a class="btn btn-about" href="about.html">2) About Us</a>
      </div>

      <div class="mini">
        Instagram: <a href="https://www.instagram.com/mirzaninmutfagi?igsh=czNydXQ2bm1qa3c2&utm_source=qr" target="_blank" rel="noopener">mirzaninmutfagi</a>
      </div>
    </div>
  </div>

  <footer>
    © Mirzanin Mutfağı • <a href="https://www.instagram.com/mirzaninmutfagi?igsh=czNydXQ2bm1qa3c2&utm_source=qr" target="_blank" rel="noopener">Instagram</a>
  </footer>
</body>
</html>
