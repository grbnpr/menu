<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mirzanin Mutfağı | Menu</title>
  <style>
    :root{
      --purple:#5a189a;
      --purple2:#3c096c;
      --yellow:#f6c21c;
      --text:#111;
      --muted:#444;
      --card:#ffffff;
      --border:rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      color:var(--text);
      background:
        linear-gradient(rgba(255,255,255,.90), rgba(255,255,255,.90)),
        url("pattern.png");
      background-size: 900px;
      background-repeat: repeat;
    }
    header{
      background:linear-gradient(90deg,var(--purple),var(--purple2));
      color:#fff;
      border-bottom:4px solid var(--yellow);
      padding:12px 16px;
      position:sticky;
      top:0;
      z-index:999;
    }
    .top{
      max-width:1100px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
    }
    .brand img{
      width:44px;
      height:auto;
      border-radius:12px;
      background:#fff;
      padding:4px;
    }
    nav a{
      text-decoration:none;
      font-weight:900;
      padding:10px 14px;
      border-radius:14px;
      display:inline-block;
      margin-left:8px;
      box-shadow:0 10px 18px rgba(0,0,0,.12);
    }
    nav a.home{background:var(--yellow);color:#000;}
    nav a.about{background:#fff;color:#000;}
    .wrap{max-width:1100px;margin:0 auto;padding:18px;}
    .note{
      margin:14px 0 0;
      background:rgba(255,255,255,.92);
      border:1px solid var(--border);
      border-radius:18px;
      padding:14px 14px;
      line-height:1.7;
      color:var(--muted);
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
      margin-top:16px;
    }
    @media (max-width:860px){
      .grid{grid-template-columns:1fr;}
    }
    .section{
      margin-top:18px;
      padding:16px;
      background:rgba(255,255,255,.92);
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:0 10px 26px rgba(0,0,0,.08);
    }
    .section h2{
      margin:0 0 10px 0;
      font-size:18px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .item{
      border-top:1px solid rgba(0,0,0,.08);
      padding:12px 0;
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .item:first-of-type{border-top:none}
    .name{font-weight:900}
    .desc{margin:4px 0 0;color:#444;font-size:13px;line-height:1.6}
    .qty{
      min-width:130px;
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:8px;
    }
    .qty input{
      width:64px;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,.15);
      font-weight:900;
      text-align:center;
      background:#fff;
    }
    .controls{
      margin-top:16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
    }
    .btn{
      border:0;
      cursor:pointer;
      font-weight:900;
      padding:12px 16px;
      border-radius:16px;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
      transition:transform .08s ease;
    }
    .btn:active{transform:scale(.99)}
    .btn.send{background:var(--yellow);color:#000;}
    .btn.clear{background:#fff;color:#000;border:2px solid rgba(0,0,0,.12);}
    textarea, input[type="text"]{
      width:100%;
      padding:12px 12px;
      border-radius:16px;
      border:1px solid rgba(0,0,0,.15);
      background:#fff;
      font-family:inherit;
      font-size:14px;
      line-height:1.6;
    }
    .two{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:12px;
    }
    @media (max-width:860px){ .two{grid-template-columns:1fr;} }
    footer{
      padding:22px 18px 28px;
      text-align:center;
      color:#222;
      font-size:14px;
    }
    footer a{color:var(--purple);font-weight:900;text-decoration:none}
    .small{margin-top:6px;opacity:.75;font-size:12px}
  </style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand">
      <img src="logo.png" alt="Logo">
      <div>Mirzanin Mutfağı</div>
    </div>

    <nav>
      <a class="home" href="index.html">Home</a>
      <a class="about" href="about.html">About</a>
    </nav>
  </div>
</header>

<div class="wrap">

  <div class="note">
    <b>Online Sipariş:</b> Ürünleri seçin, adet yazın ve “WhatsApp’tan Gönder” butonuna basın.<br/>
    <span style="opacity:.8">Not: Fiyatlar şu an gösterilmiyor.</span>
  </div>

  <div class="section">
    <h2>📝 Sipariş Notu (İsteğe bağlı)</h2>
    <textarea id="note" rows="3" placeholder="Örn: Acısız, az tuz, teslimat saati, vb."></textarea>

    <div class="two">
      <input id="name" type="text" placeholder="Ad Soyad (isteğe bağlı)">
      <input id="address" type="text" placeholder="Adres / Konum (isteğe bağlı)">
    </div>

    <div class="controls">
      <div id="summary" style="font-weight:900;">Seçilen ürün: 0</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn clear" onclick="clearAll()">Temizle</button>
        <button class="btn send" onclick="sendWhatsApp()">WhatsApp’tan Gönder</button>
      </div>
    </div>
  </div>

  <div class="grid" id="menuGrid"></div>

</div>

<footer>
  Instagram: <a href="https://www.instagram.com/mirzaninmutfagi?igsh=czNydXQ2bm1qa3c2&utm_source=qr" target="_blank" rel="noopener">@mirzaninmutfagi</a>
  <div class="small">© Mirzanin Mutfağı</div>
</footer>

<script>
  const WHATSAPP_NUMBER = "905350715215"; // +90 535 071 5215

  // Menu data (TR first)
  const sections = [
    {
      title: "🔥 Kebaplar",
      items: [
        { id:"koobide", name:"Mirza Özel Koobide (2 Şiş)", desc:"Dana kıyma, soğan ve özel İran baharatları" },
        { id:"joojeh", name:"Safranlı Tavuk Şiş (Joojeh)", desc:"Safran, yoğurt ve baharatlarla marine" },
        { id:"kemikli", name:"Kemikli Tavuk Kebap", desc:"Geleneksel usul, sulu ve aromalı" },
        { id:"chenjek", name:"Kuzu Şiş (Chenjek)", desc:"Marine kuzu kuşbaşı, yumuşak" },
        { id:"bonfile", name:"Özel Dana Bonfile", desc:"Seçilmiş dana bonfile, çok yumuşak" }
      ]
    },
    {
      title: "🍗 Geleneksel Yemekler",
      items: [
        { id:"zereshk", name:"Zereshk Pilavı & Tavuk", desc:"Safranlı pilav + ekşi zereshk ile" },
        { id:"ghormeh", name:"Ghormeh Sabzi", desc:"Otlar, kırmızı fasulye ve et" },
        { id:"gheymeh", name:"Gheymeh", desc:"Nohut, et ve domates sosu" },
        { id:"gunun", name:"Günün Yemeği", desc:"Her gün taze, değişen ev yemeği" }
      ]
    },
    {
      title: "🥗 Meze & Salata",
      items: [
        { id:"shirazi", name:"Şirazi Salatası", desc:"Domates, salatalık, soğan, limonlu" },
        { id:"musir", name:"Yoğurt & Musir", desc:"Özel İran sarımsağı ile aromatik" },
        { id:"cacik", name:"Cacık (İran Usulü)", desc:"Yoğurt, salatalık, nane" },
        { id:"zeytin", name:"İran Usulü Zeytin", desc:"Nar ekşisi, ceviz, özel baharat" }
      ]
    },
    {
      title: "🍰 Tatlılar",
      items: [
        { id:"sholezard", name:"Sholezard", desc:"Safran, gül suyu ve pirinç" },
        { id:"helva", name:"İran Usulü Helva", desc:"Un, tereyağı ve safran" },
        { id:"shirberenj", name:"Şir Berenj", desc:"Süt ve pirinçle ev yapımı" }
      ]
    },
    {
      title: "🥤 İçecekler",
      items: [
        { id:"ayran", name:"Geleneksel Ayran", desc:"İran usulü yoğurt içeceği" },
        { id:"kola", name:"Kola / Fanta", desc:"Soğuk gazlı içecekler" },
        { id:"su", name:"Su", desc:"Doğal içme suyu" },
        { id:"cay", name:"İran Çayı", desc:"Demlenmiş İran siyah çayı" }
      ]
    }
  ];

  const quantities = {}; // id -> qty

  function render(){
    const grid = document.getElementById("menuGrid");
    grid.innerHTML = "";

    sections.forEach(sec=>{
      const box = document.createElement("div");
      box.className = "section";
      box.innerHTML = `<h2>${sec.title}</h2>`;

      sec.items.forEach(it=>{
        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = `
          <div>
            <div class="name">${it.name}</div>
            <div class="desc">${it.desc}</div>
          </div>
          <div class="qty">
            <input type="number" min="0" value="${quantities[it.id] || 0}"
              oninput="setQty('${it.id}', this.value)">
          </div>
        `;
        box.appendChild(row);
      });

      grid.appendChild(box);
    });

    updateSummary();
  }

  function setQty(id, val){
    const n = Math.max(0, parseInt(val || "0", 10));
    quantities[id] = n;
    updateSummary();
  }

  function updateSummary(){
    let count = 0;
    Object.values(quantities).forEach(v=> count += (v || 0));
    document.getElementById("summary").textContent = `Seçilen ürün: ${count}`;
  }

  function clearAll(){
    Object.keys(quantities).forEach(k=> quantities[k]=0);
    document.getElementById("note").value = "";
    document.getElementById("name").value = "";
    document.getElementById("address").value = "";
    render();
  }

  function sendWhatsApp(){
    const note = document.getElementById("note").value.trim();
    const name = document.getElementById("name").value.trim();
    const address = document.getElementById("address").value.trim();

    const lines = [];
    lines.push("Mirzanin Mutfağı - Online Sipariş");
    lines.push("--------------------------------");

    if(name) lines.push("Ad Soyad: " + name);
    if(address) lines.push("Adres: " + address);
    if(name || address) lines.push("--------------------------------");

    let any = false;
    sections.forEach(sec=>{
      sec.items.forEach(it=>{
        const q = quantities[it.id] || 0;
        if(q > 0){
          any = true;
          lines.push(`${q} x ${it.name}`);
        }
      });
    });

    if(!any){
      alert("Lütfen en az 1 ürün seçin.");
      return;
    }

    if(note){
      lines.push("--------------------------------");
      lines.push("Not: " + note);
    }

    const msg = encodeURIComponent(lines.join("\n"));
    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
    window.open(url, "_blank");
  }

  render();
</script>

</body>
</html>
