<!doctype html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mirzanin Mutfağı | Menu</title>
  <style>
    :root{
      --purple:#5a189a;
      --purple2:#3c096c;
      --yellow:#f6c21c;
      --text:#111;
      --muted:#444;
      --border:rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Tahoma,Arial,sans-serif;
      color:var(--text);
      background:
        linear-gradient(rgba(255,255,255,.90), rgba(255,255,255,.90)),
        url("pattern.png");
      background-size:900px;
      background-repeat:repeat;
    }

    header{
      background:linear-gradient(90deg,var(--purple),var(--purple2));
      color:#fff;
      border-bottom:4px solid var(--yellow);
      padding:12px 16px;
      position:sticky;
      top:0;
      z-index:999;
    }
    .top{
      max-width:1100px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      min-width:240px;
    }
    .brand img{
      width:44px;
      height:auto;
      border-radius:12px;
      background:#fff;
      padding:4px;
    }

    nav{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
    }
    nav a, nav button{
      text-decoration:none;
      font-weight:900;
      padding:10px 14px;
      border-radius:14px;
      display:inline-block;
      box-shadow:0 10px 18px rgba(0,0,0,.12);
      border:0;
      cursor:pointer;
    }
    nav a.home{background:var(--yellow);color:#000;}
    nav a.about{background:#fff;color:#000;}
    nav button.lang{
      background:rgba(255,255,255,.12);
      color:#fff;
      border:1px solid rgba(255,255,255,.22);
      box-shadow:none;
      padding:9px 12px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    nav button.lang.active{
      background:var(--yellow);
      color:#000;
      border-color:var(--yellow);
    }

    .wrap{max-width:1100px;margin:0 auto;padding:18px;}

    .note{
      margin:14px 0 0;
      background:rgba(255,255,255,.92);
      border:1px solid var(--border);
      border-radius:18px;
      padding:14px 14px;
      line-height:1.7;
      color:var(--muted);
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
      margin-top:16px;
    }
    @media (max-width:860px){
      .grid{grid-template-columns:1fr;}
    }

    .section{
      margin-top:18px;
      padding:16px;
      background:rgba(255,255,255,.92);
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:0 10px 26px rgba(0,0,0,.08);
    }
    .section h2{
      margin:0 0 10px 0;
      font-size:18px;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .item{
      border-top:1px solid rgba(0,0,0,.08);
      padding:12px 0;
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .item:first-of-type{border-top:none}

    /* ✅ layout for image + text */
    .left{
      flex:1 1 auto;
      display:flex;
      gap:12px;
      align-items:flex-start;
      min-width:0;
    }

    .food-img{
      width:92px;
      height:92px;
      border-radius:16px;
      object-fit:cover;
      border:1px solid rgba(0,0,0,.10);
      background:#fff;
      box-shadow:0 10px 18px rgba(0,0,0,.08);
      flex:0 0 auto;
    }

    /* if image missing, hide it (prevents broken icon) */
    .food-img.hide{display:none;}

    @media (max-width:520px){
      .food-img{width:82px;height:82px;border-radius:14px;}
    }

    .meta{
      flex:1 1 auto;
      min-width:0;
    }

    .topline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .name{font-weight:900}
    .desc{margin:6px 0 0;color:#444;font-size:13px;line-height:1.6}

    .price{
      font-weight:900;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(246,194,28,.25);
      border:1px solid rgba(246,194,28,.7);
      color:#000;
      white-space:nowrap;
    }

    .qty{
      min-width:150px;
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
    }
    .qbtn{
      width:40px;
      height:40px;
      border-radius:14px;
      border:0;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 10px 18px rgba(0,0,0,.10);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .qbtn.minus{background:#fff;color:#000;border:2px solid rgba(0,0,0,.12); box-shadow:none;}
    .qbtn.plus{background:var(--yellow);color:#000;}
    .qnum{
      min-width:44px;
      text-align:center;
      font-weight:900;
      font-size:15px;
      padding:8px 6px;
      border-radius:12px;
      background:#fff;
      border:1px solid rgba(0,0,0,.12);
    }

    .controls{
      margin-top:16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
    }
    .btn{
      border:0;
      cursor:pointer;
      font-weight:900;
      padding:12px 16px;
      border-radius:16px;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
      transition:transform .08s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:active{transform:scale(.99)}
    .btn.send{background:var(--yellow);color:#000;}
    .btn.clear{background:#fff;color:#000;border:2px solid rgba(0,0,0,.12); box-shadow:none;}

    textarea, input[type="text"]{
      width:100%;
      padding:12px 12px;
      border-radius:16px;
      border:1px solid rgba(0,0,0,.15);
      background:#fff;
      font-family:inherit;
      font-size:14px;
      line-height:1.6;
    }
    .two{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:12px;
    }
    @media (max-width:860px){ .two{grid-template-columns:1fr;} }

    footer{
      padding:22px 18px 28px;
      text-align:center;
      color:#222;
      font-size:14px;
    }
    footer a{color:var(--purple);font-weight:900;text-decoration:none}
    .small{margin-top:6px;opacity:.75;font-size:12px}

    .rtl{direction:rtl; text-align:right;}
    .rtl .left{flex-direction:row-reverse;}
    .rtl .topline{justify-content:space-between;}
  </style>
</head>

    if(p === null || p === undefined || p === "") return "";
    return `₺${p}`;

    document.documentElement.lang = (lang==="TR" ? "tr" : "fa");
    document.documentElement.dir  = (lang==="TR" ? "ltr" : "rtl");

    el("btnFA").classList.toggle("active", lang==="FA");

        row.setAttribute("data-id", it.id);

        const desc = (lang==="TR" ? it.descTR : it.descFA);
        const n = qty[it.id] || 0;
        const priceText = formatPrice(it.price);

        const imgTag = it.img
          ? `<img class="food-img" src="${it.img}" alt="${name}">`
          : `<img class="food-img hide" alt="">`;

        row.innerHTML = `
          <div class="left">
            ${imgTag}
            <div class="meta">
              <div class="topline">
                <div class="name">${name}</div>
                ${priceText ? `<div class="price">${priceText}</div>` : ``}

          <div class="qty">
            <button class="qbtn minus" type="button" aria-label="minus">−</button>
            <div class="qnum" data-q="${it.id}">${n}</div>
            <button class="qbtn plus" type="button" aria-label="plus">+</button>
          </div>
        `;

        // hide broken images automatically
        const img = row.querySelector(".food-img");
        if(img && !img.classList.contains("hide")){
          img.onerror = () => img.classList.add("hide");
        }

        row.querySelector(".minus").onclick = () => dec(it.id);
        row.querySelector(".plus").onclick  = () => inc(it.id);

        box.appendChild(row);
      });

      grid.appendChild(box);
    });
  }

  function updateQtyUI(id){
    const qEl = document.querySelector(`[data-q="${id}"]`);
    if(qEl) qEl.textContent = (qty[id] || 0);
  }

  function countAll(){ return Object.values(qty).reduce((a,b)=>a+(b||0),0); }
  function updateSummary(){
    el("summary").textContent = t(`Seçilen ürün: ${countAll()}`, `تعداد انتخاب‌شده: ${countAll()}`);
  }

  function clearAll(){
    Object.keys(qty).forEach(k=> qty[k]=0);
    el("note").value = "";
    el("name").value = "";
    el("address").value = "";
    render();
    updateSummary();
  }

  function sendWhatsApp(){
    const note = el("note").value.trim();
    const name = el("name").value.trim();
    const address = el("address").value.trim();

    const lines = [];
    lines.push(t("Mirzanin Mutfağı - Online Sipariş", "Mirzanin Mutfağı - سفارش آنلاین"));
    lines.push("--------------------------------");

    if(name) lines.push(t("Ad Soyad: ","نام: ") + name);
    if(address) lines.push(t("Adres: ","آدرس: ") + address);
    if(name || address) lines.push("--------------------------------");

    let any = false;
    sections.forEach(sec=>{
      sec.items.forEach(it=>{
        const q = qty[it.id] || 0;
        if(q > 0){
          any = true;
          const nm = (lang==="TR" ? it.nameTR : it.nameFA);
          const pr = formatPrice(it.price);
          lines.push(`${q} x ${nm}${pr ? " — " + pr : ""}`);
        }
      });
    });

    if(!any){
      alert(t("Lütfen en az 1 ürün seçin.", "لطفاً حداقل ۱ آیتم انتخاب کن."));
      return;
    }

    if(note){
      lines.push("--------------------------------");
      lines.push(t("Not: ","توضیح: ") + note);
    }

    const msg = encodeURIComponent(lines.join("\n"));
    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
    window.open(url, "_blank");
  }

  el("btnTR").onclick = () => setLang("TR");
  el("btnFA").onclick = () => setLang("FA");
  el("btnClear").onclick = clearAll;
  el("btnSend").onclick = sendWhatsApp;

  setLang("TR");
</script>

</body>
</html>
